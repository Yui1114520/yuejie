name: 发布静态快照

# 为什么放在 GitHub Actions：这台电脑关机 / 断网时，yuejie-site.pages.dev 就没人重新生成。
# runner 的网络是通的，可以直接跑现成的聚合与导出，再把 site/ 推到 Pages。
# 代价：翻译源（youdao / MyMemory）在云厂商共享 IP 上经常限流，标题翻译会比本机差；去重账本靠 cache 续命。

on:
  schedule:
    - cron: "*/30 * * * *"
  # 代码一变更就发一版，省得等下一个半点
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 上一轮没跑完不叠加下一轮，避免两个进程抢同一个 sqlite
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      # Secret 没配时立刻失败，别先花几分钟抓一轮再倒在发布上
      - name: 检查发布凭据
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN：仓库 Settings → Secrets and variables → Actions 添加后重跑"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      # sqlite 账本和翻译缓存都不进仓库，靠 cache 跨轮次延续；
      # key 每轮唯一、restore-keys 取最新，旧条目由 GitHub 按 LRU 淘汰
      - name: 恢复去重账本与翻译缓存
        uses: actions/cache@v4
        with:
          path: |
            data/press.sqlite3
            data/push.sqlite3
            data/translations.json
            site/img
          key: yuejie-state-${{ github.run_id }}
          restore-keys: |
            yuejie-state-

      # Secret 里多带一个空格或换行，会让 43 个海外源整批 401。
      # 这里统一去掉空白，再真打一次中转做预检：401 就是 token 不对，立刻失败，不浪费一轮抓取
      - name: 写入运行环境并校验中转
        env:
          SECRET_RELAY_URL: ${{ secrets.RELAY_URL }}
          SECRET_RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          mkdir -p data
          url="$(printf '%s' "$SECRET_RELAY_URL" | tr -d '[:space:]')"
          tok="$(printf '%s' "$SECRET_RELAY_TOKEN" | tr -d '[:space:]')"
          if [ -z "$url" ]; then
            echo "PORT=8787" > .env
            echo "::warning::未配置 RELAY_URL，海外源会被整批跳过"
            exit 0
          fi
          {
            echo "PORT=8787"
            echo "RELAY_URL=$url"
            echo "RELAY_TOKEN=$tok"
          } > .env
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 25 -X POST "$url/fetch" -H "authorization: Bearer $tok" -H 'content-type: application/json' -d '{"url":"https://example.com/"}')"
          echo "中转预检 HTTP $code（403 或 200 表示 token 有效）"
          if [ "$code" = "401" ]; then
            echo "::error::RELAY_TOKEN 与中转不匹配（401），请到 Settings → Secrets 重新粘贴，不要带空格或换行"
            exit 1
          fi

      # 导出脚本会自己拉起后端、等 /api/health 就绪，再跑 npm run site
      - name: 起后端并导出快照
        run: node scripts/publish-site.mjs --export-only

      - name: 推送到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8ea0da843cd9026a1aa2457d864d8364
        run: npx --yes wrangler@4 pages deploy site --project-name yuejie-site --branch main
